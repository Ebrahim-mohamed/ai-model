# Broker config only — no Python here, ever (claude.md §1.1).
#
# consumer_timeout: RabbitMQ's default (30 min as of 3.8.15+) closes the
# channel with PreconditionFailed (406) if a consumer doesn't ack a
# delivery within this window. Celery's task_acks_late=True (celery_app.py)
# means a task's ack only happens when it FINISHES — so any task running
# longer than this timeout gets its channel killed mid-task, crashing the
# worker, even though the task itself was still making real progress.
#
# tasks.embedding_generation.generate_embeddings is exactly this case on
# this dev machine's hardware: CPU-only BGE-M3 encoding of a single real
# file's chunks measurably exceeded 30 minutes in practice (a 758-chunk
# file was still <15% embedded at the 30-minute mark). Set generously
# above the worst real single-file duration observed so far (the full
# ~1,869-chunk corpus took ~11-12 hours end to end in one process) —
# not a arbitrarily large/unlimited value, since an unbounded timeout
# would mask a genuinely hung consumer instead of a slow-but-progressing
# one.
consumer_timeout = 43200000
